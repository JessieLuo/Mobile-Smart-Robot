# Gazebo Sim Jetty -> ROS 2 Jazzy bridge config
# Gazebo runs wherever available. ROS 2 nodes consume normalized ROS topics.

# =========================
# Clock
# =========================
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# =========================
# Base command
# =========================
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/mobile_sorting_robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# =========================
# Odometry / TF
# =========================
- ros_topic_name: "/odom"
  gz_topic_name: "/model/mobile_sorting_robot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/model/mobile_sorting_robot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# =========================
# Sensors
# =========================
- ros_topic_name: "/scan"
  gz_topic_name: "/model/mobile_sorting_robot/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/model/mobile_sorting_robot/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Gazebo currently exposes /model/mobile_sorting_robot/left_camera and /right_camera
# as Image topics, not /image subtopics.
- ros_topic_name: "/left_camera/image_raw"
  gz_topic_name: "/model/mobile_sorting_robot/left_camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/right_camera/image_raw"
  gz_topic_name: "/model/mobile_sorting_robot/right_camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera_info"
  gz_topic_name: "/model/mobile_sorting_robot/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

