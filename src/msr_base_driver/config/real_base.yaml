safety_filter:
  ros__parameters:
    input_topic: "/cmd_vel"
    output_topic: "/cmd_vel_safe"
    max_vx: 0.25
    max_vy: 0.12
    max_wz: 0.5
    timeout_sec: 0.5

c30d_base_driver:
  ros__parameters:
    cmd_topic: "/cmd_vel_safe"
    serial_port: "/dev/ttyACM0"
    baudrate: 115200
    dry_run: false # true for test only

    wheel_radius_m: 0.04
    half_length_m: 0.125
    half_width_m: 0.075

    max_rpm: 80.0

    # Adjust these after first real test.
    # Order: A, B, C, D
    # motor_signs: [1.0, 1.0, -1.0, -1.0]
    rpm_compensation: [1.0, 1.07, 1.07, 1.0]

    command_prefix: "M"
    timeout_sec: 0.5

    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: true # publish by ekf
    odom_publish_hz: 20.0
