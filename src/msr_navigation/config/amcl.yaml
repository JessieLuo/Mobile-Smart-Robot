# migrate from nav/ project
amcl:
  ros__parameters:

    use_sim_time: false

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "/scan"

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.05
    update_min_a: 0.1

    laser_model_type: "likelihood_field"

    max_beams: 60
    laser_max_range: 12.0
    laser_min_range: 0.1

    transform_tolerance: 0.3

    set_initial_pose: false
